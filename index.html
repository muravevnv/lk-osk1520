<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="page">
        <section class="welcome">
            <div class="container">
                <div class="welcome__inner">
                    <div class="welcome__logo">
                        <img src="images/logo.svg" alt="Логотип">
                    </div>
                    <div class="welcome__head">
                        <div class="welcome__head-title">Портал заявок на доставку ТМЦ</div>
                    </div>
                    <div class="welcome__main">
                        <div class="already-reg">
                            <div class="already-reg__title">
                                Уже зарегистрированы ?
                            </div>
                            <form action="#" class="already-reg__form">
                                <input type="text" class="already-reg__input form-control" class="form-control" placeholder="Введите ваш email" inputmode="text">
                                <button type="button" class="already-reg__btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" x="0" y="0" viewBox="0 0 32 32" style="enable-background:new 0 0 512 512" xml:space="preserve" class=""><g><path d="M1.939 27.303c.293.293.677.439 1.061.439s.768-.146 1.061-.439l10.242-10.242a1.5 1.5 0 0 0 0-2.121L4.061 4.697A1.5 1.5 0 1 0 1.94 6.818L11.121 16 1.94 25.182a1.5 1.5 0 0 0-.001 2.121M19.819 4.697a1.5 1.5 0 1 0-2.121 2.121L26.879 16l-9.181 9.182a1.5 1.5 0 1 0 2.122 2.121l10.242-10.242a1.5 1.5 0 0 0 0-2.121z" fill="#000000" opacity="1" data-original="#000000" class=""></path></g></svg>
                                </button>
                            </form>
                        </div>
                        <div class="also-reg">
                            <div class="also-reg__title">Еще не зарегистрированы ?</div>
                            <a href="#" class="also-reg__btn btn btn--xl btn--wide">Регистрация</a>
                        </div>
                    </div>
                    <div class="welcome__bottom">
                        <a href="#" class="welcome__bottom-link">Справочная информация</a>
                        <a href="#" class="welcome__bottom-link">Политика обработки персональных данных</a>
                    </div>
                </div>
            </div>
        </section>        
    </div>
</body>
</html>
