<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>

<body>
    <header class="header">
        <div class="container">
            <a href="#" class="header__logo">
                <img class="header__logo-img" src="images/logo.svg" alt="">
                <span class="header__logo-title">Портал заявок на доставку ТМЦ</span>
            </a>
            <div class="header__info">
                ООО "Название организации"
                <br>
                ИНН: 12345678910
            </div>
            <button type="button" class="header__logout">
                <span>Выход</span>
                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink"
                    width="512" height="512" x="0" y="0" viewBox="0 0 16 16" style="enable-background:new 0 0 512 512"
                    xml:space="preserve" fill-rule="evenodd" class="">
                    <g>
                        <path d="M13.5 7.25H5a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5" fill="#000000" opacity="1"
                            data-original="#000000" class=""></path>
                        <path
                            d="m12.03 11.03 2.5-2.5a.75.75 0 0 0 0-1.06l-2.5-2.5a.749.749 0 1 0-1.06 1.06L12.939 8 10.97 9.97a.749.749 0 1 0 1.06 1.06M8 13.25H3a.25.25 0 0 1-.25-.25V3A.25.25 0 0 1 3 2.75h5a.75.75 0 0 0 0-1.5H3c-.464 0-.909.184-1.237.513A1.75 1.75 0 0 0 1.25 3v10c0 .464.184.909.513 1.237.328.329.773.513 1.237.513h5a.75.75 0 0 0 0-1.5"
                            fill="#000000" opacity="1" data-original="#000000" class=""></path>
                    </g>
                </svg>
            </button>
        </div>
    </header>
    <div class="page">
        <div class="order">
            <div class="container">
                <form class="order__inner">
                    <div class="order__head">
                        Выбор даты и времени
                    </div>
                    <div class="order__form">
                        <div class="order__main">
                            <div class="form-group order-datepicker">
                                <input class="order-datepicker__input form-control" type="text"
                                    placeholder="Выберите дату и время" readonly>
                                <input class="order-datepicker__value" type="hidden" name="slot">
                                <div class="order-datepicker__popup">
                                    <div class="order-datepicker__popup-inner">
                                        <div class="order-datepicker__calendar"></div>
                                        <div class="order-datepicker__slots">
                                            <div class="order-datepicker__slots-date"></div>
                                            <div class="order-datepicker__slots-list"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <textarea class="form-control" name="" id=""
                                    placeholder="Комментарий (если необходим)"></textarea>
                            </div>
                        </div>
                        <div class="order__-instructions">
                            <div class="order__instructions-title">Цветовые метки календаря:</div>
                            <div class="order__instructions-items">
                                <div class="order__instructions-item">
                                    <div class="order__instructions-item-marker" style="--marker: #5FB457"></div>
                                    <div class="order__instructions-item-title">Слот свободен</div>
                                </div>
                                <div class="order__instructions-item">
                                    <div class="order__instructions-item-marker" style="--marker: #D6A155"></div>
                                    <div class="order__instructions-item-title">День с большой <br> загрузкой (мало
                                        свободных слотов)</div>
                                </div>
                                <div class="order__instructions-item">
                                    <div class="order__instructions-item-marker" style="--marker: #B55556"></div>
                                    <div class="order__instructions-item-title">Слот / день занят</div>
                                </div>
                                <div class="order__instructions-item">
                                    <div class="order__instructions-item-marker" style="--marker: #555555"></div>
                                    <div class="order__instructions-item-title">Выходной / перерыв</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="order__bottom">
                        <button class="order-confirm__btn btn btn--border btn--xl">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M15.7501 20.25C15.5512 20.25 15.3604 20.171 15.2198 20.0303L7.71982 12.5303C7.65014 12.4607 7.59485 12.378 7.55713 12.2871C7.51941 12.1961 7.5 12.0985 7.5 12C7.5 11.9016 7.51941 11.804 7.55713 11.713C7.59485 11.6221 7.65014 11.5394 7.71982 11.4698L15.2198 3.9698C15.5129 3.67673 15.9874 3.67673 16.2803 3.9698C16.5732 4.26286 16.5734 4.73742 16.2803 5.0303L9.31057 12L16.2803 18.9698C16.35 19.0394 16.4053 19.1221 16.443 19.213C16.4807 19.304 16.5001 19.4016 16.5001 19.5C16.5001 19.5985 16.4807 19.6961 16.443 19.7871C16.4053 19.878 16.35 19.9607 16.2803 20.0303C16.1397 20.171 15.949 20.25 15.7501 20.25Z"
                                    fill="currentColor" />
                            </svg>
                            Назад
                        </button>
                        <button type="button" class="btn btn--xl">Оформить заявку</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/imask@7.6.1/dist/imask.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
